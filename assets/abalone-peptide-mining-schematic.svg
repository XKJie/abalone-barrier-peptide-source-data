<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Abalone peptide mining illustration</title>
  <desc id="desc">A simple illustration of an abalone shell with a small pickaxe suggesting peptide mining.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5fbfc"/>
      <stop offset="100%" stop-color="#dce9ed"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3e7a88"/>
      <stop offset="100%" stop-color="#1f4757"/>
    </linearGradient>
    <linearGradient id="meat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e7d5"/>
      <stop offset="100%" stop-color="#e5c7a9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4f6770" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="170" cy="410" r="130" fill="#e7f1f3"/>
  <circle cx="1420" cy="110" r="110" fill="#e4eef1"/>

  <text x="86" y="92" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#173540">Abalone Peptide Mining</text>
  <text x="88" y="128" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#58707a">A simple repository cover illustration</text>

  <g filter="url(#shadow)">
    <ellipse cx="700" cy="308" rx="320" ry="184" fill="url(#shell)"/>
    <ellipse cx="700" cy="308" rx="246" ry="132" fill="url(#meat)"/>
  </g>

  <g opacity="0.92">
    <circle cx="928" cy="214" r="11" fill="#f1fbff"/>
    <circle cx="974" cy="242" r="11" fill="#f1fbff"/>
    <circle cx="1000" cy="289" r="11" fill="#f1fbff"/>
    <circle cx="1002" cy="342" r="11" fill="#f1fbff"/>
    <circle cx="978" cy="386" r="11" fill="#f1fbff"/>
    <circle cx="934" cy="414" r="11" fill="#f1fbff"/>
    <circle cx="880" cy="426" r="11" fill="#f1fbff"/>
  </g>

  <path d="M500 252 C588 206, 751 183, 901 221" fill="none" stroke="#89aeb9" stroke-width="10" stroke-linecap="round" opacity="0.42"/>
  <path d="M479 316 C591 280, 786 279, 908 327" fill="none" stroke="#b98f72" stroke-width="9" stroke-linecap="round" opacity="0.38"/>
  <path d="M523 365 C629 338, 757 344, 871 386" fill="none" stroke="#b98f72" stroke-width="7" stroke-linecap="round" opacity="0.28"/>

  <g transform="translate(1038 186)">
    <rect x="92" y="118" width="20" height="154" rx="10" transform="rotate(29 102 195)" fill="#7c5d43"/>
    <path d="M79 112 L131 63 L160 87 L110 136 Z" fill="#607782"/>
    <path d="M133 63 L171 81 L139 108 Z" fill="#495f69"/>
    <path d="M122 130 L150 156 L100 207 L72 181 Z" fill="#7f98a1" opacity="0.95"/>
  </g>
</svg>
