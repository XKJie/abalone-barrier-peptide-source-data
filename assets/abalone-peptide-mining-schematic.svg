  <text x="1030" y="400" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#214656">Mining hidden peptides</text>
  <text x="1030" y="435" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5b727b">from abalone protein resources</text>
