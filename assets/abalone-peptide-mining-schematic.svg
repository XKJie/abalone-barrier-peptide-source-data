<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Abalone peptide mining schematic</title>
  <desc id="desc">A simple schematic showing abalone protein source, peptide screening workflow, and barrier-related transcriptomic validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="100%" stop-color="#e3eef4"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f7c88"/>
      <stop offset="100%" stop-color="#214f5e"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4aa7c5"/>
      <stop offset="100%" stop-color="#2d7188"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7d97a3" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#55727d"/>
    </marker>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1360" cy="110" r="110" fill="#dcebf1" opacity="0.65"/>
  <circle cx="1480" cy="410" r="140" fill="#d7e7ee" opacity="0.6"/>
  <circle cx="180" cy="420" r="150" fill="#e7f1f5" opacity="0.85"/>

  <text x="90" y="86" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#173642">Abalone Peptide Mining</text>
  <text x="90" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52707a">Source proteins to screened peptides and barrier-related validation</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="320" height="270" rx="26" fill="#ffffff"/>
    <rect x="450" y="165" width="280" height="270" rx="26" fill="#ffffff"/>
    <rect x="790" y="165" width="300" height="270" rx="26" fill="#ffffff"/>
    <rect x="1150" y="165" width="360" height="270" rx="26" fill="#ffffff"/>
  </g>

  <text x="105" y="210" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e4250">1. Protein Source</text>
  <g transform="translate(120 245)">
    <ellipse cx="92" cy="70" rx="88" ry="56" fill="url(#shell)"/>
    <ellipse cx="112" cy="66" rx="70" ry="42" fill="#d7eef4" opacity="0.22"/>
    <circle cx="154" cy="44" r="8" fill="#eef7fa"/>
    <circle cx="170" cy="61" r="8" fill="#eef7fa"/>
    <circle cx="179" cy="82" r="8" fill="#eef7fa"/>
    <circle cx="174" cy="104" r="8" fill="#eef7fa"/>
    <path d="M40 115 C85 140, 145 140, 190 110" fill="none" stroke="#163f4c" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>
  <text x="105" y="392" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5a737c">Abalone protein sequences</text>

  <text x="485" y="210" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e4250">2. Peptide Mining</text>
  <g transform="translate(495 246)">
    <rect x="0" y="16" width="190" height="18" rx="9" fill="#b9d7e0"/>
    <rect x="16" y="64" width="88" height="22" rx="11" fill="url(#pill)"/>
    <rect x="116" y="64" width="58" height="22" rx="11" fill="#6fb6cb"/>
    <rect x="36" y="108" width="74" height="22" rx="11" fill="#2d7188"/>
    <rect x="120" y="108" width="80" height="22" rx="11" fill="#89c8d9"/>
    <circle cx="214" cy="75" r="20" fill="#edf5f8" stroke="#7da2af" stroke-width="3"/>
    <path d="M205 75 h18 M214 66 v18" stroke="#57727d" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="170" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5a737c">Digest, filter, deduplicate</text>
  </g>

  <text x="825" y="210" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e4250">3. Candidate Peptides</text>
  <g transform="translate(835 246)">
    <rect x="0" y="16" width="90" height="28" rx="14" fill="url(#pill)"/>
    <rect x="110" y="16" width="110" height="28" rx="14" fill="#6fb6cb"/>
    <rect x="38" y="68" width="136" height="28" rx="14" fill="#2d7188"/>
    <rect x="10" y="120" width="86" height="28" rx="14" fill="#89c8d9"/>
    <rect x="116" y="120" width="120" height="28" rx="14" fill="#3d8da8"/>
    <text x="0" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5a737c">Physicochemical screening</text>
  </g>

  <text x="1185" y="210" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e4250">4. Barrier Validation</text>
  <g transform="translate(1188 244)">
    <rect x="0" y="0" width="130" height="150" rx="18" fill="#eef6f8"/>
    <rect x="24" y="102" width="16" height="28" rx="5" fill="#8ec6d5"/>
    <rect x="52" y="78" width="16" height="52" rx="5" fill="#5da5bc"/>
    <rect x="80" y="52" width="16" height="78" rx="5" fill="#2d7188"/>
    <rect x="108" y="28" width="16" height="102" rx="5" fill="#204f5f"/>
    <line x1="18" y1="130" x2="122" y2="130" stroke="#7996a1" stroke-width="3"/>
    <line x1="18" y1="24" x2="18" y2="130" stroke="#7996a1" stroke-width="3"/>
    <g transform="translate(176 14)">
      <path d="M0 52 C0 20, 20 0, 52 0 C84 0, 104 20, 104 52 C104 84, 84 104, 52 104 C20 104, 0 84, 0 52 Z" fill="#edf6f8"/>
      <path d="M17 52 C28 40, 39 32, 52 32 C65 32, 76 40, 87 52 C76 64, 65 72, 52 72 C39 72, 28 64, 17 52 Z" fill="#74b6ca"/>
      <path d="M52 18 v68" stroke="#7f9da7" stroke-width="3" stroke-dasharray="4 6"/>
      <path d="M18 52 h68" stroke="#7f9da7" stroke-width="3" stroke-dasharray="4 6"/>
    </g>
    <text x="0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5a737c">Expression and pathway readouts</text>
  </g>

  <path d="M396 300 H438" stroke="#55727d" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M736 300 H778" stroke="#55727d" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1096 300 H1138" stroke="#55727d" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <text x="454" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6d8892">enzymatic digestion</text>
  <text x="794" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6d8892">candidate selection</text>
  <text x="1154" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6d8892">functional evaluation</text>
</svg>
