<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Abalone peptide mining illustration</title>
  <desc id="desc">A simple illustration of an abalone shell with a small pickaxe and peptide motifs suggesting peptide mining.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5fbfc"/>
      <stop offset="100%" stop-color="#dce9ed"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3e7a88"/>
      <stop offset="100%" stop-color="#1f4757"/>
    </linearGradient>
    <linearGradient id="meat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e7d5"/>
      <stop offset="100%" stop-color="#e5c7a9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4f6770" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="170" cy="410" r="130" fill="#e7f1f3"/>
  <circle cx="1420" cy="110" r="110" fill="#e4eef1"/>

  <text x="86" y="92" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#173540">Abalone Peptide Mining</text>
  <text x="88" y="128" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#58707a">A simple repository cover illustration</text>

  <g filter="url(#shadow)">
    <ellipse cx="655" cy="308" rx="300" ry="178" fill="url(#shell)"/>
    <ellipse cx="655" cy="308" rx="232" ry="128" fill="url(#meat)"/>
  </g>

  <g opacity="0.92">
    <circle cx="868" cy="218" r="11" fill="#f1fbff"/>
    <circle cx="911" cy="244" r="11" fill="#f1fbff"/>
    <circle cx="936" cy="289" r="11" fill="#f1fbff"/>
    <circle cx="937" cy="340" r="11" fill="#f1fbff"/>
    <circle cx="914" cy="383" r="11" fill="#f1fbff"/>
    <circle cx="872" cy="410" r="11" fill="#f1fbff"/>
    <circle cx="821" cy="422" r="11" fill="#f1fbff"/>
  </g>

  <path d="M470 256 C552 212, 706 188, 843 224" fill="none" stroke="#89aeb9" stroke-width="10" stroke-linecap="round" opacity="0.42"/>
  <path d="M452 316 C558 282, 742 281, 855 326" fill="none" stroke="#b98f72" stroke-width="9" stroke-linecap="round" opacity="0.38"/>
  <path d="M494 362 C595 336, 715 342, 820 384" fill="none" stroke="#b98f72" stroke-width="7" stroke-linecap="round" opacity="0.28"/>

  <g transform="translate(1015 174)">
    <rect x="108" y="128" width="18" height="146" rx="9" transform="rotate(28 117 201)" fill="#7c5d43"/>
    <path d="M96 123 L146 76 L173 98 L125 147 Z" fill="#607782"/>
    <path d="M148 75 L185 92 L155 117 Z" fill="#495f69"/>
    <path d="M136 139 L162 163 L113 213 L87 190 Z" fill="#7f98a1" opacity="0.95"/>
  </g>

  <g transform="translate(1050 180)">
    <circle cx="226" cy="100" r="10" fill="#2c7086"/>
    <circle cx="251" cy="82" r="10" fill="#68aec1"/>
    <circle cx="279" cy="100" r="10" fill="#2c7086"/>
    <circle cx="304" cy="82" r="10" fill="#68aec1"/>
    <circle cx="332" cy="100" r="10" fill="#2c7086"/>
    <path d="M226 100 C238 124, 267 124, 279 100 C291 76, 320 76, 332 100" fill="none" stroke="#5f8793" stroke-width="5" stroke-linecap="round"/>

    <circle cx="252" cy="178" r="10" fill="#68aec1"/>
    <circle cx="279" cy="160" r="10" fill="#2c7086"/>
    <circle cx="307" cy="178" r="10" fill="#68aec1"/>
    <circle cx="334" cy="160" r="10" fill="#2c7086"/>
